name: env-monitor-thingsboard
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: ${TB_DB_PASSWORD:?Create .env first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 5s
      retries: 12
  thingsboard:
    image: thingsboard/tb-node:4.3.1.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      TB_SERVICE_ID: env-monitor-local
      TB_QUEUE_TYPE: in-memory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${TB_DB_PASSWORD}
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres-data:
