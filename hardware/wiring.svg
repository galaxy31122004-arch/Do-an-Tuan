<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
 <defs><style>
 text{font-family:Arial,sans-serif;fill:#18263d;font-size:17px}.title{font-size:30px;font-weight:bold}.head{font-size:22px;font-weight:bold}.small{font-size:15px}.box{fill:#fff;stroke:#526985;stroke-width:2}.sig{fill:none;stroke:#2563eb;stroke-width:3}.power{fill:none;stroke:#d94835;stroke-width:3}.low{fill:none;stroke:#07916f;stroke-width:3}.note{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1}.wire{font-size:16px;font-weight:bold}
 </style></defs>
 <rect width="1440" height="1100" fill="#f8fafc"/>
 <text x="40" y="48" class="title">AT89S52 + ESP32 — System wiring</text>
 <text x="40" y="78">AT89S52 DIP-40 · ESP32-C3 SuperMini · 9600 baud · software I²C, below 100 kHz</text>
 <rect x="35" y="102" width="1370" height="125" rx="12" class="note"/>
 <text x="55" y="133" class="head">Power: one regulated 5 V / 2 A source</text>
 <text x="55" y="166">J1 +5V → F1 (1 A hold) → +5V: AT89S52, TXS VCCB, DHT11, ESP32 5V/VIN</text>
 <text x="55" y="195">ESP32 3V3 → OLED VCC + TXS VCCA. All grounds common. OE → GPIO6 + R4 100k to GND.</text>
 <rect x="460" y="280" width="390" height="355" rx="12" class="box"/>
 <text x="485" y="320" class="head">U1 · AT89S52</text>
 <text x="485" y="356">VCC 40 → +5V</text><text x="485" y="384">GND 20; EA 31 → +5V → GND</text>
 <text x="485" y="422">P3.2 / 12 ← DHT11 DATA</text>
 <text x="485" y="459">P1.1 / 2 → SCL_HV</text>
 <text x="485" y="492">P1.0 / 1 ↔ SDA_HV</text>
 <text x="485" y="533">P3.1 TX / 11 → TXS B3</text>
 <text x="485" y="568">P3.0 RX / 10 ← TXS B4</text>
 <text x="485" y="607">P3.3 / 13 ← SW1 page button</text>
 <rect x="45" y="280" width="300" height="190" rx="12" class="box"/>
 <text x="65" y="316" class="head">U5 · DHT11 bare</text>
 <text x="65" y="350">1 VCC → +5V</text><text x="65" y="380">2 DATA → P3.2</text>
 <text x="65" y="410">3 NC · 4 GND → GND</text><text x="65" y="442" class="small">R2 4.7k: DATA → +5V</text>
 <path d="M345 380 H400 V420 H460" class="sig"/>
 <rect x="45" y="505" width="300" height="235" rx="12" class="note"/>
 <text x="65" y="542" class="head">Time source: ESP32 NTP</text>
 <text x="65" y="577">Internet NTP → ESP32 UTC</text>
 <text x="65" y="608">UART T frame → AT89S52 display</text>
 <text x="65" y="638">OLED: UTC+7</text>
 <text x="65" y="669">Boot without sync:</text>
 <text x="65" y="699">TIME NOT SYNCED</text>
 <text x="65" y="725" class="small">No external RTC / backup battery</text>
 <rect x="970" y="280" width="425" height="180" rx="12" class="box"/>
 <text x="990" y="316" class="head">OLED SSD1315 · 0.96 inch</text>
 <text x="990" y="350">VCC → 3V3 · GND → GND</text><text x="990" y="380">SDA/SCL → TXS A1/A2</text>
 <text x="990" y="410">0x3C default · check module labels</text>
 <text x="990" y="440" class="small">C5 100nF + C8 10µF across 3V3/GND</text>
 <rect x="960" y="490" width="435" height="165" rx="12" class="box"/>
 <text x="980" y="523" class="head">U4 · TXS0108E module</text>
 <text x="980" y="553">VCCA=3V3 · VCCB=5V · GND</text><text x="980" y="582">B1 SDA_HV ↔ A1 OLED SDA</text>
 <text x="980" y="612">B2 SCL_HV ↔ A2 OLED SCL</text><text x="980" y="640">C3/C13 100nF · built-in pull-ups</text>
 <path d="M850 459 H909 V550 H960 M850 492 H890 V580 H960" class="sig"/>
 <path d="M1320 490 V460 M1360 490 V460" class="low"/>
 <rect x="45" y="785" width="535" height="245" rx="12" class="box"/>
 <text x="65" y="820" class="head">Clock / reset / programming</text>
 <text x="65" y="853">Y1 11,0592 MHz between XTAL1/19 and XTAL2/18</text>
 <text x="65" y="882">C9/C10 22pF → GND (check crystal load)</text>
 <text x="65" y="911">RST/9 → R1 10k → GND; SW2 → +5V</text>
 <text x="65" y="940">P3.3/13 → R3 10k → +5V; SW1 → GND</text>
 <text x="65" y="972">Burn-E: program/verify HEX off-board.</text>
 <text x="65" y="1001">C2 10uF: (+) +5V, (-) RST. J3 ISP: wiring.md.</text>
 <rect x="660" y="755" width="735" height="275" rx="12" class="box"/>
 <text x="680" y="790" class="head">U2 ESP32 + U4 TXS0108E UART</text>
 <text x="680" y="827" class="wire">AT89S52 TX/11 → TXS B3 ↔ A3 → ESP32 GPIO4 RX</text>
 <text x="680" y="857">No divider or separate UART buffer.</text>
 <text x="680" y="894" class="wire">ESP32 GPIO5 TX → TXS A4 ↔ B4 → AT89S52 RX/10</text>
 <text x="680" y="926">GPIO6 → OE; R4 100k OE → GND; enable after 100ms.</text>
 <text x="680" y="956">A5–A8/B5–B8 NC. Inspect any module OE jumper.</text>
 <text x="680" y="986">C7 470µF at ESP32. Module headers J5A/J5B: check footprint.</text>
 <path d="M850 533 H920 V705 H1060 V755 M850 568 H880 V725 H1120 V755" class="sig"/>
 <text x="40" y="1070" class="small">Assembly overview, not a PCB production netlist. Full pin tables: wiring.md · Every fitted part: BOM.md / BOM.csv</text>
</svg>
