[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; SuperMini uses the same ESP32-C3 target with native USB CDC console.
build_flags = -Wall -Wextra -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:demo]
extends = env:esp32c3
build_flags = ${env:esp32c3.build_flags} -DDEMO_MODE=1
